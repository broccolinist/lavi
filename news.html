    <link rel="icon" href="img/logo/favicon-192.png" sizes="192x192" type="image/png">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Bug&Lavi Project-ばぐらび">
    <meta property="og:title" content="NEWS | Bug&Lavi Project-ばぐらび">
    <meta property="og:url" content="https://bug-and-lavi-project.com/news.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=20261002e">
</head>

<body>
    <header id="site-header" class="site-header"></header>

    <main>
        <section class="page-hero" data-bg="NEWS">
            <div class="wrap">
                <p class="crumb"><a href="index.html">HOME</a> / NEWS</p>
                <h1><span class="en glitch" data-text="NEWS">NEWS</span><span class="ja">お知らせ</span></h1>
            </div>
        </section>

        <section class="section" style="padding-top:clamp(20px,4vw,40px)">
            <div class="wrap">
                <div class="filter-bar reveal" id="filter">
                    <button class="is-active" data-f="ALL">ALL</button>
                    <button data-f="INFO">INFO</button>
                    <button data-f="MUSIC">MUSIC</button>
                    <button data-f="NOVEL">NOVEL</button>
                </div>
                <div class="news-articles" id="news-container"><p class="loading">LOADING</p></div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="js/data.js?v=20261002c"></script>
    <script src="js/news.js?v=20261002c"></script>
    <script src="js/site.js?v=20261002c"></script>
    <script>
        window.pageInit = async () => {
            const box = document.getElementById('news-container');
            const news = await loadNews();
            box.innerHTML = news.map(n => `
                <article class="news-article reveal ${n.image ? '' : 'no-image'}" id="${n.id}" data-cat="${n.category}">
                    ${n.image ? `<div class="thumb"><img src="${n.image}" alt="" loading="lazy"></div>` : ''}
                    <div>
                        <div class="meta"><span class="date">${n.date}</span><span class="cat cat-${n.category}">${n.category}</span>${isNew(n.date) ? '<span class="badge-new" style="margin:0">NEW</span>' : ''}</div>
                        <h2>${esc(n.title)}</h2>
                        <div class="body">${n.body}</div>
                    </div>
                </article>`).join('') || '<p class="loading">NO DATA</p>';
            box.querySelectorAll('.body a[target="_blank"]').forEach(a => a.rel = 'noopener');

            document.getElementById('filter').addEventListener('click', e => {
                const b = e.target.closest('button');
                if (!b) return;
                document.querySelectorAll('#filter button').forEach(x => x.classList.toggle('is-active', x === b));
                box.querySelectorAll('.news-article').forEach(a => a.style.display = (b.dataset.f === 'ALL' || a.dataset.cat === b.dataset.f) ? '' : 'none');
            });
            if (location.hash) setTimeout(() => document.getElementById(location.hash.slice(1))?.scrollIntoView(), 50);
        };
    </script>
</body>

</html>
