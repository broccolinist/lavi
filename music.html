<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC | Bug&amp;Lavi Project</title>
    <meta name="description" content="Lavi AI Singer-songwriterの楽曲一覧。Spotify・Apple Music・YouTubeで配信中。">
    <meta name="theme-color" content="#080b1c">
    <link rel="canonical" href="https://bug-and-lavi-project.com/music.html">
    <link rel="icon" href="img/picture/lavi_icon.png">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Bug&Lavi Project">
    <meta property="og:title" content="MUSIC | Bug&Lavi Project">
    <meta property="og:url" content="https://bug-and-lavi-project.com/music.html">
    <meta property="og:image" content="https://bug-and-lavi-project.com/img/picture/lavi_tati.png">
    <meta name="twitter:card" content="summary_large_image">
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5204ed30baa54e48af164bfa0e777612"}'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Unbounded:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=20261001">
</head>

<body data-has-releases>
    <header id="site-header" class="site-header"></header>

    <main>
        <section class="page-hero" data-bg="DISCOGRAPHY">
            <div class="wrap">
                <p class="crumb"><a href="index.html">HOME</a> / MUSIC</p>
                <h1><span class="en glitch" data-text="MUSIC">MUSIC</span><span class="ja">楽曲</span></h1>
            </div>
        </section>

        <section class="section" style="padding-top:clamp(20px,4vw,40px)">
            <div class="wrap">
                <div class="section-head reveal" style="align-items:center">
                    <div class="filter-bar" id="filter" style="margin:0">
                        <button class="is-active" data-f="ALL">ALL</button>
                        <button data-f="Single">SINGLE</button>
                        <button data-f="EP">EP</button>
                    </div>
                    <div class="artist-links">
                        <a class="stream-btn is-spotify" href="https://open.spotify.com/intl-ja/artist/19IjM1QzTxBX14RzfEIzNV" target="_blank" rel="noopener"><i class="fab fa-spotify"></i><span>Spotify</span></a>
                        <a class="stream-btn is-apple" href="https://music.apple.com/jp/artist/lavi-ai-singer-songwriter/1851121558" target="_blank" rel="noopener"><i class="fab fa-apple"></i><span>Apple Music</span></a>
                    </div>
                </div>
                <div class="release-grid" id="release-grid"></div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="js/data.js?v=20261001"></script>
    <script src="js/site.js?v=20261001"></script>
    <script>
        window.pageInit = () => {
            const grid = document.getElementById('release-grid');
            grid.innerHTML = RELEASES.map((r, i) => releaseCard(r, i).replace('class="release-card', `data-type="${r.type}" class="release-card`)).join('');
            document.getElementById('filter').addEventListener('click', e => {
                const b = e.target.closest('button');
                if (!b) return;
                document.querySelectorAll('#filter button').forEach(x => x.classList.toggle('is-active', x === b));
                grid.querySelectorAll('.release-card').forEach(c => c.classList.toggle('is-hidden', b.dataset.f !== 'ALL' && c.dataset.type !== b.dataset.f));
            });
        };
    </script>
</body>

</html>
