# 毎日、YouTube の最新の横動画3本（js/videos.json）と、Apple Music の作品一覧（js/releases.json）を更新する
name: Update latest videos and releases

on:
  schedule:
    - cron: "0 0 * * *"   # 毎日 9:00（日本時間）
  workflow_dispatch:       # GitHub の画面から手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_videos.py
      - run: python scripts/update_releases.py
      - name: Commit if changed
        run: |
          if git diff --quiet js/videos.json js/releases.json; then
            echo "変更なし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
            git add js/videos.json js/releases.json
            git commit -m "最新の動画・楽曲を更新"
            git push
          fi
