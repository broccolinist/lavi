# 毎日、YouTube の最新の横動画3本（js/videos.json）・ショート4本（js/shorts.json）と、Apple Music の作品一覧（js/releases.json）を更新する
name: Update latest videos and releases

on:
  schedule:
    # 毎日 6:23（日本時間）。GitHub の定時実行は混むと数時間遅れるので、9時ごろに間に合うよう早めにしている。
    # 「毎時0分」は特に混むので避ける
    - cron: "23 21 * * *"
  workflow_dispatch:       # GitHub の画面から手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # YouTube 公式の API のキー（リポジトリの Settings → Secrets and variables → Actions に登録）
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/update_videos.py
      - run: python scripts/update_releases.py
      - name: Commit if changed
        run: |
          if git diff --quiet js/videos.json js/shorts.json js/releases.json; then
            echo "変更なし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
            git add js/videos.json js/shorts.json js/releases.json
            git commit -m "最新の動画・楽曲を更新"
            git push
          fi
