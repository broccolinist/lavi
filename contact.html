<body>
    <header id="site-header" class="site-header"></header>

    <main>
        <section class="page-hero" data-bg="CONTACT">
            <div class="wrap">
                <p class="crumb"><a href="index.html">HOME</a> / CONTACT</p>
                <h1><span class="en glitch" data-text="CONTACT">CONTACT</span><span class="ja">お問い合わせ</span></h1>
            </div>
        </section>

        <section class="section" style="padding-top:clamp(20px,4vw,40px)">
            <div class="wrap narrow">
                <p class="form-intro reveal">Bug&amp;Lavi Projectへのご意見・ご感想・ご相談などは、以下のフォームよりお送りください。<br>内容によってはお返事までにお時間をいただく場合がございます。</p>
                <form action="https://ssgform.com/s/ksv3VlVP7hTt" method="POST" class="form reveal">
                    <div class="field">
                        <label for="f-subject">件名 <span class="req">REQUIRED</span></label>
                        <input id="f-subject" type="text" name="件名" required>
                    </div>
                    <div class="field">
                        <label for="f-name">お名前 <span class="req">REQUIRED</span></label>
                        <input id="f-name" type="text" name="お名前" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="f-kana">フリガナ <span class="opt">OPTIONAL</span></label>
                        <input id="f-kana" type="text" name="フリガナ">
                    </div>
                    <div class="field">
                        <label for="f-mail">メールアドレス <span class="req">REQUIRED</span></label>
                        <input id="f-mail" type="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="f-body">お問い合わせ内容 <span class="req">REQUIRED</span></label>
                        <textarea id="f-body" name="お問い合わせ内容" required></textarea>
                    </div>
                    <input type="hidden" name="redirect_to" value="https://bug-and-lavi-project.com/index.html">
                    <input type="hidden" name="g-recaptcha-response" id="g-recaptcha-response">
                    <p class="form-consent"><a href="privacy.html">プライバシーポリシー</a>に同意のうえ送信してください。</p>
                    <button type="submit" class="submit-btn">SEND</button>
                    <p class="form-recaptcha" hidden>このフォームは reCAPTCHA で保護されており、Google の<a href="https://policies.google.com/privacy?hl=ja" target="_blank" rel="noopener">プライバシーポリシー</a>と<a href="https://policies.google.com/terms?hl=ja" target="_blank" rel="noopener">利用規約</a>が適用されます。</p>
                </form>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="js/data.js?v=20261009a"></script>
    <script src="js/news.js?v=20261009a"></script>
    <script src="js/site.js?v=20261009a"></script>
    <script>
        /* 迷惑メール対策：Google reCAPTCHA v3
           1. https://www.google.com/recaptcha/admin で v3 を登録（ドメイン：bug-and-lavi-project.com）
           2. 表示された「シークレットキー」を SSGform のフォーム設定（reCAPTCHA）に入力
           3. 「サイトキー」を下の RECAPTCHA_SITE_KEY に貼る
           空欄のあいだは reCAPTCHA なしで、今までどおり送信される */
        const RECAPTCHA_SITE_KEY = '6Ldgz9gtAAAAAELkMetCu_E7EcZ9BmT0rtNmM1zo';
        if (RECAPTCHA_SITE_KEY) {
            const s = document.createElement('script');
            s.src = `https://www.google.com/recaptcha/api.js?render=${RECAPTCHA_SITE_KEY}`;
            document.head.appendChild(s);
            document.querySelector('.form-recaptcha').hidden = false;
            const form = document.querySelector('form.form');
            form.addEventListener('submit', e => {
                e.preventDefault();
                if (!form.reportValidity()) return;
                grecaptcha.ready(() => grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'submit' }).then(token => {
                    document.getElementById('g-recaptcha-response').value = token;
                    form.submit();
                }));
            });
        }
    </script>
